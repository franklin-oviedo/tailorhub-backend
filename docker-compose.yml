services:
  postgres:
    image: postgres:16-alpine
    container_name: tailorhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tailorhub
    ports:
      - "5432:5432"
    volumes:
      - tailorhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tailorhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tailorhub_pgdata:
